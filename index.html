<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Extinção dos Dinossauros</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Cenário principal */
    #cenario {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 70%, #3b7a57 70%, #2d5a27 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 12vh;
      transition: background 2s ease;
    }

    /* Camada preta que cobre a tela após os meteoros */
    #escuridao {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2.5s ease-in-out;
      z-index: 10;
    }

    /* Container dos Dinossauros */
    .dino-box {
      position: relative;
      width: 280px;
      height: 280px;
      z-index: 20; /* Fica acima da escuridão para o fóssil brilhar no escuro */
    }

    .dino-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 2s ease-in-out, transform 0.3s ease;
    }

    /* O fóssil começa invisível */
    #dino-fossil {
      opacity: 0;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.3));
    }

    /* Estilo dos Meteoros */
    .meteoro {
      position: absolute;
      top: -100px;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, #fff700, #ff6a00, #d10000);
      border-radius: 50%;
      box-shadow: 0 0 25px #ff4500, 0 0 50px #ff0000;
      z-index: 5;
      animation: cair linear forwards;
    }

    /* Cauda de fogo do meteoro */
    .meteoro::after {
      content: '';
      position: absolute;
      top: -60px;
      left: 15px;
      width: 8px;
      height: 90px;
      background: linear-gradient(to top, rgba(255, 106, 0, 0.9), transparent);
      transform: rotate(25deg);
      transform-origin: bottom center;
    }

    /* Animação de queda diagonal */
    @keyframes cair {
      0% {
        transform: translate(0, 0) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translate(-350px, 115vh) scale(1.4);
        opacity: 0.9;
      }
    }

    /* Efeito de tremor na tela */
    @keyframes tremer {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 8px); }
      40% { transform: translate(10px, -8px); }
      60% { transform: translate(-8px, -6px); }
      80% { transform: translate(8px, 6px); }
    }

    .tremendo {
      animation: tremer 0.4s infinite;
    }

    /* Botão para repetir a animação */
    #btn-reiniciar {
      position: absolute;
      bottom: 30px;
      z-index: 30;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #000;
      background-color: #e2dfd5;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease, transform 0.2s;
    }

    #btn-reiniciar:hover {
      transform: scale(1.05);
      background-color: #ffffff;
    }

    #btn-reiniciar.visivel {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div id="cenario">
    <!-- Camada que escurece a página -->
    <div id="escuridao"></div>

    <!-- Container do Dinossauro -->
    <div class="dino-box" id="dino-container">
      
      <!-- 1. DINOSSAURO VIVO (Verde) -->
      <svg id="dino-vivo" class="dino-svg" viewBox="0 0 200 200">
        <!-- Cauda -->
        <path d="M 55 130 Q 15 125 10 95 Q 25 115 60 110 Z" fill="#2e8b57"/>
        <!-- Perna traseira -->
        <rect x="65" y="135" width="16" height="35" rx="6" fill="#236b43"/>
        <path d="M 62 168 L 85 168 L 85 174 L 62 174 Z" fill="#1b5233"/>
        <!-- Corpo -->
        <ellipse cx="90" cy="115" rx="38" ry="30" fill="#3cb371"/>
        <!-- Barriga -->
        <path d="M 75 138 Q 105 142 122 120 Q 105 132 75 130 Z" fill="#98fb98"/>
        <!-- Perna dianteira -->
        <rect x="102" y="135" width="16" height="35" rx="6" fill="#2e8b57"/>
        <path d="M 100 168 L 122 168 L 122 174 L 100 174 Z" fill="#236b43"/>
        <!-- Braço pequeno -->
        <path d="M 122 105 L 140 110 L 136 116 L 120 112 Z" fill="#2e8b57"/>
        <!-- Pescoço e Cabeça -->
        <path d="M 105 95 L 115 50 L 145 50 L 135 100 Z" fill="#3cb371"/>
        <rect x="112" y="35" width="58" height="32" rx="12" fill="#3cb371"/>
        <!-- Boca -->
        <path d="M 135 56 L 168 56" stroke="#1b5233" stroke-width="3" stroke-linecap="round"/>
        <!-- Olho -->
        <circle cx="145" cy="45" r="4.5" fill="#ffffff"/>
        <circle cx="146" cy="45" r="2" fill="#000000"/>
        <!-- Espinhos nas costas -->
        <polygon points="75,86 82,74 89,86" fill="#ff8c00"/>
        <polygon points="92,86 99,74 106,86" fill="#ff8c00"/>
        <polygon points="107,75 115,63 118,78" fill="#ff8c00"/>
      </svg>

      <!-- 2. DINOSSAURO FÓSSIL (Ossos no escuro) -->
      <svg id="dino-fossil" class="dino-svg" viewBox="0 0 200 200">
        <!-- Vértebras da Cauda -->
        <circle cx="20" cy="102" r="3" fill="#e8e4d9"/>
        <circle cx="30" cy="108" r="4" fill="#e8e4d9"/>
        <circle cx="42" cy="113" r="5" fill="#e8e4d9"/>
        <circle cx="55" cy="116" r="6" fill="#e8e4d9"/>
        <!-- Coluna Vertebral -->
        <path d="M 55 116 Q 90 105 122 92 L 126 55" stroke="#e8e4d9" stroke-width="7" stroke-dasharray="8 4" fill="none"/>
        <!-- Costelas -->
        <path d="M 75 112 Q 72 132 82 136" stroke="#dcd6c8" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 88 109 Q 85 134 95 138" stroke="#dcd6c8" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 101 105 Q 98 130 108 134" stroke="#dcd6c8" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 113 100 Q 112 122 120 125" stroke="#dcd6c8" stroke-width="4" stroke-linecap="round" fill="none"/>
        <!-- Ossos da Perna Traseira -->
        <line x1="72" y1="125" x2="72" y2="148" stroke="#e8e4d9" stroke-width="6" stroke-linecap="round"/>
        <line x1="72" y1="152" x2="72" y2="170" stroke="#e8e4d9" stroke-width="5" stroke-linecap="round"/>
        <path d="M 65 172 L 82 172" stroke="#e8e4d9" stroke-width="4" stroke-linecap="round"/>
        <!-- Ossos da Perna Dianteira -->
        <line x1="110" y1="125" x2="110" y2="148" stroke="#e8e4d9" stroke-width="6" stroke-linecap="round"/>
        <line x1="110" y1="152" x2="110" y2="170" stroke="#e8e4d9" stroke-width="5" stroke-linecap="round"/>
        <path d="M 103 172 L 120 172" stroke="#e8e4d9" stroke-width="4" stroke-linecap="round"/>
        <!-- Bracinho de osso -->
        <path d="M 124 98 L 138 105 L 134 112" stroke="#dcd6c8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <!-- Crânio Fóssil -->
        <path d="M 115 36 L 166 38 L 164 52 L 136 52 L 136 63 L 162 63 L 160 68 L 116 66 Z" fill="#e8e4d9"/>
        <!-- Cavidade do Olho e Narina -->
        <circle cx="134" cy="45" r="6.5" fill="#000000"/>
        <circle cx="156" cy="44" r="3" fill="#000000"/>
        <!-- Dentes -->
        <polygon points="140,52 143,58 146,52" fill="#e8e4d9"/>
        <polygon points="149,52 152,58 155,52" fill="#e8e4d9"/>
        <polygon points="158,52 161,58 164,52" fill="#e8e4d9"/>
      </svg>

    </div>

    <!-- Botão para ver novamente -->
    <button id="btn-reiniciar" onclick="iniciarAnimacao()">Ver Novamente</button>
  </div>

  <script>
    const cenario = document.getElementById('cenario');
    const escuridao = document.getElementById('escuridao');
    const dinoVivo = document.getElementById('dino-vivo');
    const dinoFossil = document.getElementById('dino-fossil');
    const dinoContainer = document.getElementById('dino-container');
    const btnReiniciar = document.getElementById('btn-reiniciar');

    function criarMeteoro() {
      const meteoro = document.createElement('div');
      meteoro.classList.add('meteoro');
      
      // Posição horizontal aleatória (mais para a direita pois eles caem na diagonal para a esquerda)
      meteoro.style.left = (Math.random() * 110 + 10) + 'vw';
      
      // Velocidade aleatória
      const duracao = Math.random() * 0.7 + 0.7;
      meteoro.style.animationDuration = duracao + 's';

      cenario.appendChild(meteoro);

      // Remove o meteoro da memória após cair
      setTimeout(() => {
        meteoro.remove();
      }, duracao * 1000);
    }

    function iniciarAnimacao() {
      // 1. Resetar estado inicial (Dia claro, dinossauro vivo)
      escuridao.style.opacity = '0';
      dinoVivo.style.opacity = '1';
      dinoFossil.style.opacity = '0';
      btnReiniciar.classList.remove('visivel');
      cenario.classList.remove('tremendo');

      // 2. Começar chuva de meteoros após 1.2 segundos
      setTimeout(() => {
        cenario.classList.add('tremendo'); // Tela começa a tremer
        
        const intervaloMeteoros = setInterval(criarMeteoro, 120);

        // Para de criar novos meteoros após 2.5 segundos
        setTimeout(() => {
          clearInterval(intervaloMeteoros);
        }, 2500);

      }, 1200);

      // 3. Escurecer a tela e transformar em fóssil após 3.2 segundos
      setTimeout(() => {
        escuridao.style.opacity = '1'; // Página fica toda preta
        dinoVivo.style.opacity = '0';  // Dinossauro vivo desaparece
        dinoFossil.style.opacity = '1'; // Fóssil aparece
        
        // Para de tremer quando a poeira assenta
        setTimeout(() => {
          cenario.classList.remove('tremendo');
